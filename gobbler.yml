name: gobbler
channels:
  - conda-forge
dependencies:
  # TensorFlow publishes no Windows wheel for Python 3.14 yet.
  - python=3.13
  - pip
  - ffmpeg
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      # birdnetlib imports TensorFlow and audioread without declaring them.
      - tensorflow
      - audioread
      # pydub, used by birdnetlib, needs the audioop module Python 3.13 removed.
      - audioop-lts
      - -e .[dev]
